{% extends 'portal/base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-9 col-xl-8">

            <nav aria-label="breadcrumb" class="mb-5">
                <ol class="breadcrumb bg-transparent p-0 m-0">
                    <li class="breadcrumb-item"><a href="{% url 'index' %}" class="text-decoration-none text-muted">Главная</a></li>
                    <li class="breadcrumb-item active fw-bold text-primary" aria-current="page">Новость</li>
                </ol>
            </nav>

            <header class="mb-5">
                <div class="d-flex align-items-center gap-3 mb-4">
                    <span class="badge {% if article.importance == 'high' %}bg-danger{% else %}bg-primary{% endif %} px-3 py-2 rounded-pill shadow-sm">
                        {{ article.get_importance_display }}
                    </span>
                    <div class="vr opacity-10"></div>
                    <span class="text-muted"><i class="bi bi-calendar3 me-1"></i> {{ article.created_at|date:"d E Y" }}</span>
                </div>

                <h1 class="display-4 fw-extrabold mb-4" style="color: #0f172a; letter-spacing: -1px; line-height: 1.1;">
                    {{ article.title }}
                </h1>
            </header>

            <article class="article-body" style="font-size: 1.15rem; line-height: 1.8; color: #334155;">
                <div class="content-wrapper">
                    {{ article.content|linebreaks }}
                </div>
            </article>

            <footer class="mt-5 pt-5 border-top">
                <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-4">
                    <a href="{% url 'index' %}" class="btn btn-outline-dark rounded-pill px-4 fw-bold shadow-sm">
                        <i class="bi bi-arrow-left me-2"></i> Вернуться к новостям
                    </a>
                </div>
            </footer>

        </div>
    </div>
</div>

<style>
    /* Добавляем немного кастомного стиля для красоты */
    .fw-extrabold { font-weight: 800; }
    .article-body p { margin-bottom: 1.5rem; }
    .article-body b, .article-body strong { color: #0f172a; }

    /* Делаем списки групп (как на скрине) более аккуратными */
    .content-wrapper {
        white-space: pre-wrap; /* Сохраняет форматирование, если в БД текст вбит списком */
    }
</style>
{% endblock %}
