{% extends 'portal/base.html' %}

{% block content %}
<style>
    .article-card {
        background: #fff;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
        padding: 40px 48px;
    }
    .article-body {
        font-size: 1rem;
        line-height: 1.8;
        color: #334155;
    }
    .article-body p { margin-bottom: 1.25rem; }
    .article-body strong { color: #0f172a; }
</style>

<div class="container-fluid">
    <div class="row justify-content-center">
        <div class="col-xl-8 col-lg-10">

            <!-- Хлебные крошки -->
            <nav aria-label="breadcrumb" class="mb-4">
                <ol class="breadcrumb bg-transparent p-0 m-0">
                    <li class="breadcrumb-item">
                        <a href="{% url 'portal:index' %}" class="text-decoration-none text-muted">Главная</a>
                    </li>
                    <li class="breadcrumb-item active fw-bold text-primary" aria-current="page">Новость</li>
                </ol>
            </nav>

            <div class="article-card shadow-sm">

                <!-- Мета -->
                <div class="d-flex align-items-center gap-3 mb-3">
                    <span class="badge {% if article.importance == 'urgent' %}bg-danger{% elif article.importance == 'important' %}bg-primary{% else %}bg-secondary{% endif %} px-3 py-2 rounded-pill">
                        {{ article.get_importance_display }}
                    </span>
                    <span class="text-muted small">
                        <i class="bi bi-calendar3 me-1"></i>{{ article.created_at|date:"d.m.Y" }}
                    </span>
                </div>

                <!-- Заголовок -->
                <h1 class="fw-bold mb-4" style="font-size: 1.75rem; color: #0f172a; line-height: 1.3;">
                    {{ article.title }}
                </h1>

                <hr class="mb-4" style="border-color: #f1f5f9;">

                <!-- Контент -->
                <article class="article-body">
                    {{ article.content|linebreaks }}
                </article>

                <hr class="mt-4 mb-4" style="border-color: #f1f5f9;">

                <!-- Назад -->
                <a href="{% url 'portal:index' %}" class="btn btn-outline-secondary rounded-pill px-4 btn-sm fw-bold">
                    <i class="bi bi-arrow-left me-2"></i>Вернуться к новостям
                </a>

            </div>

        </div>
    </div>
</div>
{% endblock %}
